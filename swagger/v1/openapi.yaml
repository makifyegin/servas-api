---
openapi: 3.1.0
info:
  title: Servas API
  version: 1.0.0
servers:
- url: http://localhost:3001
paths:
  "/api/countries":
    get:
      summary: index
      tags:
      - Api::Country
      responses:
        '200':
          description: responds 200 OK with all countries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    created_at:
                      type: string
                    updated_at:
                      type: string
                    group_id:
                      type: integer
                  required:
                  - id
                  - name
                  - created_at
                  - updated_at
                  - group_id
              example:
              - id: 1
                name: Ireland
                created_at: '2026-01-01T12:00:00.000Z'
                updated_at: '2026-01-01T12:00:00.000Z'
                group_id: 2
        '401':
          description: responds 401 Unauthorized when no token is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Unauthorized
    post:
      summary: create
      tags:
      - Api::Country
      responses:
        '201':
          description: responds 201 Created with the new country
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  group_id:
                    type: integer
                required:
                - id
                - name
                - created_at
                - updated_at
                - group_id
              example:
                id: 2
                name: Ireland
                created_at: '2026-01-01T12:00:00.000Z'
                updated_at: '2026-01-01T12:00:00.000Z'
                group_id: 2
        '400':
          description: responds 400 Bad Request when the country params are missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: 'param is missing or the value is empty or invalid: country'
        '401':
          description: responds 401 Unauthorized when no token is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Unauthorized
        '403':
          description: responds 403 Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Forbidden
        '422':
          description: responds 422 Unprocessable Content when the name is already
            taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: 'Error creating country: Validation failed: Name has already
                  been taken'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                country:
                  type: object
                  properties:
                    name:
                      type: string
                    group_id:
                      type: string
                  required:
                  - name
                  - group_id
              required:
              - country
            example:
              country:
                name: Ireland
                group_id: '2'
